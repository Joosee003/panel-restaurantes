# Install as /etc/nginx/sites-available/gastrohelp-waha AFTER certificate issuance.
# Replaces waha.http.conf; keeps its HTTP challenge for certificate renewal.
# Loaded by sites-enabled from the nginx http context (Ubuntu default).
limit_req_zone $binary_remote_addr zone=gastrohelp_waha_rate:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gastrohelp_waha_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name waha.gastrohelp.es;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        if ($args != "") { return 400; }
        root /var/www/gastrohelp-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name waha.gastrohelp.es;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/waha.gastrohelp.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waha.gastrohelp.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gastrohelp_waha_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Error logs can contain request URIs/LIDs. No per-request logging for WAHA.
    # Monitor container health, aggregate status and external probes instead.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_in_file_only off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /api/server/version {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location = /api/sessions {
        if ($request_method !~ "^(GET|POST)$") { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location ~ "^/api/sessions/[A-Za-z0-9_-]{1,80}$" {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location ~ "^/api/sessions/[A-Za-z0-9_-]{1,80}/(start|stop|logout)$" {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location ~ "^/api/[A-Za-z0-9_-]{1,80}/auth/qr$" {
        if ($request_method != GET) { return 405; }
        if ($args != "format=image") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location ~ "^/api/[A-Za-z0-9_-]{1,80}/lids/[1-9][0-9]{0,29}@lid$" {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location ~ "^/api/[A-Za-z0-9_-]{1,80}/new-message-id$" {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    location = /api/sendText {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        include /etc/nginx/snippets/gastrohelp-waha-proxy.conf;
    }

    # Includes admin environment/stop, media, dashboard, Swagger, /ws and health.
    location / { return 404; }
}
