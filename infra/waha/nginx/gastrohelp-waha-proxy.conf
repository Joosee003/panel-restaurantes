# Location-only snippet. Install as /etc/nginx/snippets/gastrohelp-waha-proxy.conf.
# The actual secret remains in WAHA. Nginx forwards the header for validation.
if ($http_x_api_key = "") { return 401; }

limit_req zone=gastrohelp_waha_rate burst=40 nodelay;
limit_conn gastrohelp_waha_connections 20;

proxy_http_version 1.1;
proxy_set_header Host waha.gastrohelp.es;
proxy_set_header X-Api-Key $http_x_api_key;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Connection "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Origin "";

# No buffering to disk, caches, automatic failover or retries of a send.
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_cache off;
proxy_store off;
proxy_next_upstream off;
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_redirect off;

proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Expose-Headers;

# No URI suffix: retain the complete matched API path, including encoded LIDs.
proxy_pass http://127.0.0.1:3000;
