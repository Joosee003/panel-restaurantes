# Install as /etc/nginx/sites-available/gastrohelp-waha for HTTP bootstrap.
# Do not enable this file together with waha.https.conf.
# There is no proxy and no redirect while DNS/TLS is being prepared.
server {
    listen 80;
    listen [::]:80;
    server_name waha.gastrohelp.es;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        if ($args != "") { return 400; }
        root /var/www/gastrohelp-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
