name: Final reputation audit fixes

on:
  push:
    paths:
      - '.github/workflows/final-reputation-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Expose the editable aspect labels to the public review form.
          route = Path('app/api/opiniones/[slug]/route.ts')
          text = route.read_text()
          text = text.replace('.select("seo_keywords")', '.select("seo_keywords,aspect_labels")')
          text = text.replace(
              'const config = { ...baseConfig, seo_keywords: seoKeywords };',
              'const config = { ...baseConfig, seo_keywords: seoKeywords, aspect_labels: keywordConfig?.aspect_labels ?? {} };',
          )
          route.write_text(text)

          # Keep answered reviews visible for only 15 days.
          elite = Path('app/opiniones-admin/ReputationElite.tsx')
          text = elite.read_text()
          old = 'const answered = googleOpinions.filter((item) => item.seguimiento === "resuelto" && !recentlyAnswered[item.id]);'
          new = '''const answeredCutoff = Date.now() - 15 * 24 * 60 * 60 * 1000;
  const answered = googleOpinions.filter((item) => {
    if (item.seguimiento !== "resuelto" || recentlyAnswered[item.id]) return false;
    if (!item.resuelto_at) return true;
    return new Date(item.resuelto_at).getTime() >= answeredCutoff;
  });'''
          if old not in text:
              raise SystemExit('Answered reviews filter not found')
          elite.write_text(text.replace(old, new, 1))

          # Include editable fields in the shared public config type.
          public_review = Path('lib/opiniones/public-review.ts')
          text = public_review.read_text()
          old = '  contact_prompt_enabled: boolean;\n};'
          new = '''  contact_prompt_enabled: boolean;
  aspect_labels?: Partial<Record<AspectKey, string>>;
  seo_keywords?: string[];
};'''
          if old not in text:
              raise SystemExit('PublicConfig ending not found')
          public_review.write_text(text.replace(old, new, 1))
          PY

      - name: Build production app
        run: |
          npm ci
          npm run build

      - name: Commit verified changes
        run: |
          git config user.name "GastroHelp Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/opiniones/[slug]/route.ts app/opiniones-admin/ReputationElite.tsx lib/opiniones/public-review.ts
          git commit -m "Corregir etiquetas públicas y retención de reseñas"
          git push
