name: Panel quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Review message and transport tests
        run: node --test tests/review-flow.test.mjs

      - name: Install isolated SQL test dependencies
        run: npm ci --prefix tests/sql

      - name: Review flow against the captured application schema
        run: node scripts/test-review-schema.mjs

      - name: Review delivery concurrency on PostgreSQL 17
        run: node scripts/test-review-concurrent.mjs

      - name: Public review page and API with synthetic SQL
        run: node scripts/test-review-http.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
