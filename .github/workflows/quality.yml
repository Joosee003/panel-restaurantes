name: Panel quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  sql-fixtures:
    name: SQL fixtures and concurrent QR operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/sql/package-lock.json

      - name: Install pinned test dependencies
        run: npm ci --prefix tests/sql --ignore-scripts --no-audit --no-fund

      - name: Prepare PostgreSQL package libraries
        working-directory: tests/sql/node_modules/@embedded-postgres/linux-x64
        run: node scripts/hydrate-symlinks.js

      - name: Client data and recovery checks
        run: node --test tests/*.test.mjs

      - name: SQL permissions and atomic operations
        env:
          GASTROHELP_SQL_TEST_ROOT: ${{ github.workspace }}/tests/sql
        run: |
          node scripts/test-room-capacity.mjs
          node scripts/test-qr-close-sql.mjs tests/sql/node_modules/@electric-sql/pglite/dist/index.js
          node scripts/test-qr-reservation-sql.mjs tests/sql/node_modules/@electric-sql/pglite/dist/index.js
          node scripts/test-manual-consumption-sql.mjs tests/sql/node_modules/@electric-sql/pglite/dist/index.js
          node scripts/test-qr-menu-origin-sql.mjs tests/sql/node_modules/@electric-sql/pglite/dist/index.js
          node scripts/test-qr-profitability-sql.mjs tests/sql/node_modules/@electric-sql/pglite/dist/index.js

      - name: Real PostgreSQL 17 concurrent operations
        run: >-
          node scripts/test-sql-concurrent.mjs
          tests/sql/node_modules/@embedded-postgres/linux-x64/native/bin
          tests/sql/node_modules/pg

      - name: Captured application schema and 26 concurrent operations
        run: >-
          node scripts/test-application-concurrent.mjs
          tests/fixtures/application-catalog-2026-09-08.json
          tests/sql/node_modules/@embedded-postgres/linux-x64/native/bin
          tests/sql/node_modules/pg
          /tmp/gastrohelp-application-concurrency.json
