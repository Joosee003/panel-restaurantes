name: Finalize reputation delivery

on:
  push:
    paths:
      - '.github/workflows/finalize-reputation-delivery.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply final fixes
        run: python scripts/finalize_reputation.py
      - name: Validate production build
        run: |
          npm ci
          npm run build
      - name: Commit final fixes
        run: |
          git config user.name "GastroHelp Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/opiniones/[slug]/route.ts app/opiniones-admin/ReputationElite.tsx app/opiniones-admin/AspectLabelsEditor.tsx app/opiniones-admin/HispanosReputationSuite.tsx lib/opiniones/public-review.ts app/opinion/[slug]/ReviewForm.tsx
          git commit -m "Cerrar funcionamiento del sistema de reputación"
          git push
