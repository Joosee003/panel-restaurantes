name: Fix editable review aspects

on:
  push:
    paths:
      - '.github/workflows/fix-review-aspect-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace SEO editor with editable review aspects
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path('app/opiniones-admin/AspectLabelsEditor.tsx')
          editor.write_text(r'''"use client";

import { Check } from "lucide-react";
import { useEffect, useMemo, useState } from "react";
import { getOpinionesBrowserClient } from "@/lib/opiniones/supabase";

const defaults = {
  comida: "Comida",
  servicio: "Servicio",
  ambiente: "Ambiente",
  espera: "Tiempo de espera",
  limpieza: "Limpieza",
  calidad_precio: "Calidad-precio",
};

type Labels = typeof defaults;

export default function AspectLabelsEditor() {
  const supabase = useMemo(() => getOpinionesBrowserClient(), []);
  const [configId, setConfigId] = useState("");
  const [labels, setLabels] = useState<Labels>(defaults);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState<string | null>(null);

  useEffect(() => {
    setError(null);
    void supabase
      .from("opinion_config")
      .select("id,aspect_labels")
      .eq("slug", "hispanos-grill")
      .single()
      .then(({ data, error: loadError }) => {
        if (loadError || !data) {
          setError("No se pudieron cargar estas opciones.");
          return;
        }
        setConfigId(data.id as string);
        setLabels({ ...defaults, ...((data.aspect_labels ?? {}) as Partial<Labels>) });
      });
  }, [supabase]);

  async function save() {
    if (!configId) return;
    const cleaned = Object.fromEntries(
      Object.entries(labels).map(([key, value]) => [key, value.trim() || defaults[key as keyof Labels]]),
    ) as Labels;
    setSaving(true);
    setSaved(false);
    setError(null);
    const { error: saveError } = await supabase
      .from("opinion_config")
      .update({ aspect_labels: cleaned })
      .eq("id", configId);
    setSaving(false);
    if (saveError) {
      setError("No se pudieron guardar los cambios.");
      return;
    }
    setLabels(cleaned);
    setSaved(true);
    window.setTimeout(() => setSaved(false), 2200);
  }

  return (
    <section className="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
      <p className="text-[10px] font-black uppercase tracking-[.18em] text-blue-700">Formulario de opinión</p>
      <h2 className="mt-1 text-xl font-black text-slate-950">Opciones que verá el cliente</h2>
      <p className="mt-2 text-sm font-semibold leading-6 text-slate-500">Edita las seis opciones de “¿Qué te gustó más?”. Los clientes verán exactamente estas palabras al preparar su reseña.</p>
      <div className="mt-5 grid gap-3 sm:grid-cols-2">
        {(Object.keys(defaults) as Array<keyof Labels>).map((key) => (
          <label key={key} className="block">
            <span className="mb-1.5 block text-[10px] font-black uppercase tracking-wide text-slate-400">{defaults[key]}</span>
            <input value={labels[key]} onChange={(event) => setLabels((current) => ({ ...current, [key]: event.target.value.slice(0, 40) }))} className="min-h-12 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm font-bold text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100" />
          </label>
        ))}
      </div>
      {error && <p className="mt-4 rounded-xl bg-red-50 p-3 text-sm font-bold text-red-700">{error}</p>}
      <button type="button" disabled={saving} onClick={() => void save()} className="mt-5 flex min-h-12 w-full items-center justify-center gap-2 rounded-xl bg-blue-700 px-4 text-sm font-black text-white disabled:opacity-60">
        {saved && <Check className="h-4 w-4" />}
        {saving ? "Guardando…" : saved ? "Guardado" : "Guardar opciones"}
      </button>
    </section>
  );
}
''')

          reputation = Path('app/opiniones-admin/ReputationElite.tsx')
          text = reputation.read_text()
          if 'import AspectLabelsEditor from "./AspectLabelsEditor";' not in text:
            text = text.replace('import ReputationMaterials from "./ReputationMaterials";\n', 'import ReputationMaterials from "./ReputationMaterials";\nimport AspectLabelsEditor from "./AspectLabelsEditor";\n')
          old = 'function SettingsPanel({ config, saving, save }: { config: OpinionConfig; saving: boolean; save: (config: OpinionConfig) => void; }) { const [draft, setDraft] = useState(config); return <div className="grid gap-5 xl:grid-cols-2">'
          new = 'function SettingsPanel({ config, saving, save }: { config: OpinionConfig; saving: boolean; save: (config: OpinionConfig) => void; }) { const [draft, setDraft] = useState(config); return <div className="space-y-5"><div className="grid gap-5 xl:grid-cols-2">'
          if old not in text:
            raise SystemExit('SettingsPanel start not found')
          text = text.replace(old, new, 1)
          ending = '</button></div></div>; }'
          if ending not in text:
            raise SystemExit('SettingsPanel ending not found')
          text = text.replace(ending, '</button></div></div><AspectLabelsEditor /></div>; }', 1)
          reputation.write_text(text)

          route = Path('app/api/opiniones/[slug]/route.ts')
          text = route.read_text()
          text = text.replace('.select("seo_keywords")', '.select("seo_keywords,aspect_labels")')
          text = text.replace('const config = { ...baseConfig, seo_keywords: seoKeywords };', 'const config = { ...baseConfig, seo_keywords: seoKeywords, aspect_labels: keywordConfig?.aspect_labels ?? {} };')
          route.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "GastroHelp Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/opiniones-admin/AspectLabelsEditor.tsx app/opiniones-admin/ReputationElite.tsx app/api/opiniones/[slug]/route.ts
          git commit -m "Permitir editar las opciones de las reseñas desde ajustes"
          git push
