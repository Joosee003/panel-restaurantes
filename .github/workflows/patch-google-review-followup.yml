name: Patch Google review follow-up

on:
  push:
    paths:
      - '.github/workflows/patch-google-review-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Simplify Google review follow-up
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/opiniones-admin/ReputationElite.tsx')
          text = path.read_text()

          text = text.replace(
            '{ id: "seguimiento", label: "Seguimiento", icon: <UserRoundCheck /> },',
            '{ id: "seguimiento", label: "Reseñas Google", icon: <UserRoundCheck /> },'
          )

          old_invocation = '''        {tab === "seguimiento" && (
          <FollowUpBoard
            opinions={opinions}
            openOpinion={openOpinion}
            move={(opinion, seguimiento) =>
              void updateOpinion(opinion.id, {
                seguimiento,
                resuelto_at:
                  seguimiento === "resuelto" ? new Date().toISOString() : null,
              })
            }
          />
        )}'''
          new_invocation = '''        {tab === "seguimiento" && (
          <FollowUpBoard
            opinions={opinions}
            googleUrl={config.google_review_url}
            openOpinion={openOpinion}
            move={(opinion, seguimiento) =>
              void updateOpinion(opinion.id, {
                seguimiento,
                resuelto_at:
                  seguimiento === "resuelto" ? new Date().toISOString() : null,
              })
            }
          />
        )}'''
          if old_invocation not in text:
            raise SystemExit('FollowUpBoard invocation not found')
          text = text.replace(old_invocation, new_invocation)

          old_priorities = '''  const priorities = opinions
    .filter(
      (item) =>
        item.seguimiento !== "resuelto" &&
        (item.rating <= 3 || item.solicita_contacto),
    )
    .slice(0, 5);'''
          new_priorities = '''  const priorities = opinions
    .filter(
      (item) => item.google_abierto && item.seguimiento !== "resuelto",
    )
    .slice(0, 5);'''
          if old_priorities in text:
            text = text.replace(old_priorities, new_priorities)

          start = text.index('function FollowUpBoard(')
          end = text.index('\nfunction InsightsPanel', start)
          replacement = r'''function FollowUpBoard({ opinions, googleUrl, openOpinion, move }: {
  opinions: Opinion[];
  googleUrl: string;
  openOpinion: (opinion: Opinion) => void;
  move: (opinion: Opinion, status: FollowUpStatus) => void;
}) {
  const [recentlyAnswered, setRecentlyAnswered] = useState<Record<string, number>>({});
  const googleOpinions = opinions.filter((item) => item.google_abierto);

  useEffect(() => {
    const interval = window.setInterval(() => {
      const now = Date.now();
      setRecentlyAnswered((current) => {
        const active = Object.fromEntries(
          Object.entries(current).filter(([, expiresAt]) => expiresAt > now),
        );
        return Object.keys(active).length === Object.keys(current).length
          ? current
          : active;
      });
    }, 1000);
    return () => window.clearInterval(interval);
  }, []);

  const pendingCheck = googleOpinions.filter(
    (item) => item.seguimiento === "pendiente",
  );
  const pendingReply = googleOpinions.filter(
    (item) =>
      item.seguimiento === "en_revision" || Boolean(recentlyAnswered[item.id]),
  );
  const answered = googleOpinions.filter(
    (item) => item.seguimiento === "resuelto" && !recentlyAnswered[item.id],
  );

  function markAnswered(opinion: Opinion) {
    setRecentlyAnswered((current) => ({
      ...current,
      [opinion.id]: Date.now() + 30_000,
    }));
    move(opinion, "resuelto");
  }

  function undoAnswered(opinion: Opinion) {
    setRecentlyAnswered((current) => {
      const next = { ...current };
      delete next[opinion.id];
      return next;
    });
    move(opinion, "en_revision");
  }

  return (
    <div className="space-y-5">
      <div className="rounded-[2rem] border border-blue-100 bg-[linear-gradient(135deg,#eff6ff,#ffffff)] p-5 sm:p-6">
        <p className="text-xs font-black uppercase tracking-[.18em] text-blue-700">
          Seguimiento de reseñas de Google
        </p>
        <h2 className="mt-2 text-2xl font-black sm:text-3xl">
          Comprueba, responde y deja cada reseña cerrada.
        </h2>
        <p className="mt-2 max-w-3xl text-sm font-semibold leading-6 text-slate-500">
          Aquí aparecen los clientes que abrieron Google Maps desde el sistema. La apertura está confirmada; la publicación se comprueba manualmente antes de responder.
        </p>
      </div>

      {!googleOpinions.length && (
        <Empty text="Todavía no hay aperturas de Google Maps registradas" />
      )}

      {googleOpinions.length > 0 && (
        <div className="grid gap-5 xl:grid-cols-3">
          <ReviewColumn
            title="Pendientes de comprobar"
            subtitle="Abrieron Google Maps"
            count={pendingCheck.length}
            tone="amber"
          >
            {pendingCheck.map((opinion) => (
              <GoogleReviewCard key={opinion.id} opinion={opinion} openOpinion={openOpinion}>
                <a
                  href={googleUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white p-2.5 text-[10px] font-black text-slate-700"
                >
                  Comprobar en Maps <ExternalLink className="h-3.5 w-3.5" />
                </a>
                <button
                  type="button"
                  onClick={() => move(opinion, "en_revision")}
                  className="flex-1 rounded-xl bg-blue-700 p-2.5 text-[10px] font-black text-white"
                >
                  Confirmar publicada
                </button>
              </GoogleReviewCard>
            ))}
            {!pendingCheck.length && <Empty text="Nada pendiente de comprobar" />}
          </ReviewColumn>

          <ReviewColumn
            title="Publicadas · por responder"
            subtitle="Requieren una respuesta"
            count={pendingReply.length}
            tone="blue"
          >
            {pendingReply.map((opinion) => {
              const answeredNow = Boolean(recentlyAnswered[opinion.id]);
              const seconds = answeredNow
                ? Math.max(1, Math.ceil((recentlyAnswered[opinion.id] - Date.now()) / 1000))
                : 0;
              return (
                <GoogleReviewCard key={opinion.id} opinion={opinion} openOpinion={openOpinion}>
                  {answeredNow ? (
                    <div className="w-full rounded-xl border border-emerald-200 bg-emerald-50 p-3">
                      <div className="flex items-center gap-2 text-xs font-black text-emerald-800">
                        <CheckCircle2 className="h-4 w-4" /> Marcada como respondida
                      </div>
                      <div className="mt-2 flex items-center justify-between gap-3">
                        <p className="text-[10px] font-bold text-emerald-700">
                          Se archivará en {seconds} s
                        </p>
                        <button
                          type="button"
                          onClick={() => undoAnswered(opinion)}
                          className="rounded-lg bg-white px-3 py-1.5 text-[10px] font-black text-emerald-800 shadow-sm"
                        >
                          Deshacer
                        </button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <a
                        href={googleUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white p-2.5 text-[10px] font-black text-slate-700"
                      >
                        Ver en Maps <ExternalLink className="h-3.5 w-3.5" />
                      </a>
                      <button
                        type="button"
                        onClick={() => markAnswered(opinion)}
                        className="flex-1 rounded-xl bg-emerald-600 p-2.5 text-[10px] font-black text-white"
                      >
                        Marcar como respondida
                      </button>
                    </>
                  )}
                </GoogleReviewCard>
              );
            })}
            {!pendingReply.length && <Empty text="No hay reseñas esperando respuesta" />}
          </ReviewColumn>

          <ReviewColumn
            title="Respondidas"
            subtitle="Historial cerrado"
            count={answered.length}
            tone="emerald"
          >
            {answered.map((opinion) => (
              <GoogleReviewCard key={opinion.id} opinion={opinion} openOpinion={openOpinion}>
                <span className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-emerald-50 p-2.5 text-[10px] font-black text-emerald-700">
                  <CheckCircle2 className="h-3.5 w-3.5" /> Respondida
                </span>
                <button
                  type="button"
                  onClick={() => move(opinion, "en_revision")}
                  className="flex-1 rounded-xl bg-slate-100 p-2.5 text-[10px] font-black text-slate-700"
                >
                  Reabrir
                </button>
              </GoogleReviewCard>
            ))}
            {!answered.length && <Empty text="El historial aparecerá aquí" />}
          </ReviewColumn>
        </div>
      )}
    </div>
  );
}

function ReviewColumn({ title, subtitle, count, tone, children }: {
  title: string;
  subtitle: string;
  count: number;
  tone: "amber" | "blue" | "emerald";
  children: ReactNode;
}) {
  const badge = tone === "amber"
    ? "bg-amber-50 text-amber-700"
    : tone === "blue"
      ? "bg-blue-50 text-blue-700"
      : "bg-emerald-50 text-emerald-700";
  return (
    <section className="min-h-[420px] rounded-[2rem] border border-slate-200 bg-white p-4 shadow-sm">
      <div className="mb-4 flex items-center justify-between gap-3">
        <div>
          <h3 className="font-black">{title}</h3>
          <p className="text-xs font-semibold text-slate-500">{subtitle}</p>
        </div>
        <b className={`rounded-xl px-3 py-2 ${badge}`}>{count}</b>
      </div>
      <div className="space-y-3">{children}</div>
    </section>
  );
}

function GoogleReviewCard({ opinion, openOpinion, children }: {
  opinion: Opinion;
  openOpinion: (opinion: Opinion) => void;
  children: ReactNode;
}) {
  return (
    <article className="rounded-2xl border border-slate-200 p-4 shadow-sm transition hover:border-blue-200 hover:shadow-md">
      <button type="button" onClick={() => openOpinion(opinion)} className="w-full text-left">
        <div className="flex items-start justify-between gap-3">
          <Rating rating={opinion.rating} />
          <span className="rounded-full bg-blue-50 px-2 py-1 text-[9px] font-black uppercase tracking-wide text-blue-700">
            Google abierto
          </span>
        </div>
        <p className="mt-3 font-black">{opinion.nombre_cliente || "Cliente anónimo"}</p>
        <p className="mt-1 line-clamp-3 text-xs font-semibold leading-5 text-slate-500">
          {opinion.comentario || "Sin comentario"}
        </p>
        <p className="mt-3 text-[10px] font-bold text-slate-400">
          {opinion.google_abierto_at ? formatDateTime(opinion.google_abierto_at) : formatDateTime(opinion.created_at)}
        </p>
      </button>
      <div className="mt-4 flex gap-2">{children}</div>
    </article>
  );
}
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "GastroHelp Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/opiniones-admin/ReputationElite.tsx
          git commit -m "Simplificar seguimiento de reseñas de Google"
          git push
